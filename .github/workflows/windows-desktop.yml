name: Windows Desktop

on:
  push:
    branches: [ "main" ]
    paths:
      - "apps/windows-desktop/**"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "apps/windows-desktop/**"
      - ".github/workflows/windows-desktop.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore apps/windows-desktop/PseudoRun.sln

      - name: Build
        run: dotnet build apps/windows-desktop/PseudoRun.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test apps/windows-desktop/PseudoRun.sln --configuration Release --no-build

      - name: Publish Self-Contained EXE
        run: >
          dotnet publish apps/windows-desktop/src/PseudoRun.Desktop/PseudoRun.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          /p:PublishSingleFile=true
          --output ./publish

      - name: Upload Published App
        uses: actions/upload-artifact@v4
        with:
          name: pseudorun-desktop-${{ github.sha }}
          path: publish/
          retention-days: 14
