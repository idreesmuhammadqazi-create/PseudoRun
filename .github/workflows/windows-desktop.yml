name: Windows Desktop

on:
  push:
    branches: [ main ]
    tags: [ 'desktop-v*' ]
    paths:
      - 'apps/windows-desktop/**'
      - '.github/workflows/windows-desktop.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/windows-desktop/**'
      - '.github/workflows/windows-desktop.yml'

env:
  APP_CSPROJ: apps/windows-desktop/src/PseudoRun.Desktop/PseudoRun.Desktop.csproj
  TEST_CSPROJ: apps/windows-desktop/tests/PseudoRun.Desktop.Tests/PseudoRun.Desktop.Tests.csproj
  APPXMANIFEST: apps/windows-desktop/src/PseudoRun.Desktop.Package/Package.appxmanifest
  PACKAGE_IMAGES: apps/windows-desktop/src/PseudoRun.Desktop.Package/Images

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore (app + tests)
        run: |
          dotnet restore ${{ env.APP_CSPROJ }}
          dotnet restore ${{ env.TEST_CSPROJ }}
      - name: Build (app + tests)
        run: |
          dotnet build ${{ env.APP_CSPROJ }} --configuration Release --no-restore
          dotnet build ${{ env.TEST_CSPROJ }} --configuration Release --no-restore
      - name: Test
        run: dotnet test ${{ env.TEST_CSPROJ }} --configuration Release --no-build --filter "Category!=IntegrationWindows"
      - name: Publish self-contained EXE
        run: >
          dotnet publish ${{ env.APP_CSPROJ }}
          --configuration Release
          --runtime win-x64
          --self-contained true
          /p:PublishSingleFile=true
          --output ./publish-exe
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: pseudorun-desktop-exe-${{ github.sha }}
          path: publish-exe/
          retention-days: 14

  build-msix:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: windows-latest
    needs: build-and-test
    env:
      STORE_PACKAGE_IDENTITY_NAME: ${{ secrets.STORE_PACKAGE_IDENTITY_NAME }}
      STORE_PUBLISHER_CN: ${{ secrets.STORE_PUBLISHER_CN }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Windows 10 SDK 22621 (for makeappx.exe)
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
        with:
          sdk-version: 22621

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^desktop-v',''
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { $version = "$version.0" }
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish WPF app (framework-dependent; MSIX provides runtime)
        # NOTE: self-contained=false means the MSIX is ~20 MB; the Store will
        # auto-install .NET 8 Desktop Runtime as a framework dependency.
        # If you prefer a bigger self-contained MSIX, set self-contained=true
        # and remove the <PackageDependency> for WindowsAppRuntime/.NET below.
        run: >
          dotnet publish ${{ env.APP_CSPROJ }}
          --configuration Release
          --runtime win-x64
          --self-contained true
          /p:PublishSingleFile=false
          --output msix-staging

      - name: Stage MSIX layout (manifest + assets + app binaries)
        shell: pwsh
        run: |
          # The msix-staging/ folder already has the WPF app's binaries from
          # `dotnet publish`. Now drop the AppxManifest and Images next to them
          # so `makeappx pack` sees a valid package layout.
          Copy-Item -Path "${{ env.APPXMANIFEST }}" -Destination "msix-staging/AppxManifest.xml" -Force
          New-Item -ItemType Directory -Force -Path "msix-staging/Images" | Out-Null
          Copy-Item -Path "${{ env.PACKAGE_IMAGES }}/*" -Destination "msix-staging/Images/" -Force

          # Our logo files are named *.scale-200.png but the manifest references
          # the bare name (e.g. Square150x150Logo.png). MSIX can handle scale
          # qualifiers via resource index, but it's simpler for v1 to just
          # provide the base filenames. Copy each scale-200 variant to its
          # bare name so the manifest's literal paths resolve.
          Get-ChildItem -Path msix-staging/Images -Filter '*.scale-200.png' | ForEach-Object {
            $bare = $_.Name -replace '\.scale-200\.png$', '.png'
            Copy-Item $_.FullName (Join-Path $_.Directory $bare) -Force
          }

          # Fill identity / publisher / version placeholders in the staged manifest.
          # Use string replace for the placeholder tokens (safe, non-ambiguous),
          # and scope the Version substitution to <Identity> ONLY so we don't
          # accidentally clobber MinVersion / MaxVersionTested on TargetDeviceFamily
          # (both of which also contain 'Version="..."' substrings).
          $p = "msix-staging/AppxManifest.xml"
          $c = Get-Content $p -Raw
          $c = $c.Replace('PSEUDORUN_PACKAGE_IDENTITY_NAME_PLACEHOLDER', $env:STORE_PACKAGE_IDENTITY_NAME)
          $c = $c.Replace('PSEUDORUN_PUBLISHER_CN_PLACEHOLDER', $env:STORE_PUBLISHER_CN)
          $c = $c.Replace('PSEUDORUN_PUBLISHER_DISPLAY_NAME_PLACEHOLDER', $env:STORE_PUBLISHER_DISPLAY_NAME)
          $c = $c -replace '(?s)(<Identity\b[^>]*?)Version="\d+\.\d+\.\d+\.\d+"', ('$1Version="${{ steps.version.outputs.version }}"')
          # Rewrite the Executable path: the wapproj manifest assumed
          # "PseudoRun.Desktop\PseudoRun.exe" (subfolder layout inside the
          # package). With makeappx our layout is flat — executable is at root.
          $c = $c -replace 'Executable="PseudoRun\.Desktop\\PseudoRun\.exe"', 'Executable="PseudoRun.exe"'
          # Same for logos — drop the "Images\" prefix duplicates that reference
          # non-scale-200 names. Partner Center-generated manifests expect
          # "Images\<name>.png" matching our staged folder, which already works.
          Set-Content $p $c -NoNewline

          Write-Host "--- Staged manifest ---"
          Get-Content $p | Select-Object -First 50
          Write-Host "--- Staged layout (top 20) ---"
          Get-ChildItem -Path msix-staging | Select-Object -First 20 | Format-Table Name, Length

      - name: Locate makeappx.exe
        id: makeappx
        shell: pwsh
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $cand = Get-ChildItem -Path $sdkRoot -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -like "*\x64\*" } |
                  Sort-Object FullName -Descending |
                  Select-Object -First 1
          if (-not $cand) { throw "makeappx.exe not found under $sdkRoot" }
          Write-Host "Using $($cand.FullName)"
          Write-Output "path=$($cand.FullName)" >> $env:GITHUB_OUTPUT

      - name: Pack MSIX
        shell: pwsh
        run: |
          $out = "PseudoRun.Desktop_${{ steps.version.outputs.version }}_x64.msix"
          & "${{ steps.makeappx.outputs.path }}" pack /d msix-staging /p $out /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed ($LASTEXITCODE)" }
          Write-Output "msix=$out" >> $env:GITHUB_OUTPUT
          Get-Item $out | Format-List Name, Length
        id: pack

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: pseudorun-desktop-msix-${{ steps.version.outputs.version }}
          path: ${{ steps.pack.outputs.msix }}
          retention-days: 30

      - name: Submit to Microsoft Store
        if: env.STORE_AZURE_CLIENT_ID != ''
        env:
          STORE_AZURE_TENANT_ID: ${{ secrets.STORE_AZURE_TENANT_ID }}
          STORE_AZURE_CLIENT_ID: ${{ secrets.STORE_AZURE_CLIENT_ID }}
          STORE_AZURE_CLIENT_SECRET: ${{ secrets.STORE_AZURE_CLIENT_SECRET }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_APP_ID: ${{ secrets.STORE_APP_ID }}
        uses: isaacrlevin/windows-store-action@1.0
        with:
          tenant-id: ${{ secrets.STORE_AZURE_TENANT_ID }}
          client-id: ${{ secrets.STORE_AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.STORE_AZURE_CLIENT_SECRET }}
          app-id: ${{ secrets.STORE_APP_ID }}
          package-path: ${{ steps.pack.outputs.msix }}
          skip-polling: false
          delete-packages: true
          delete-only-failed-packages: false
